<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage Services</title>

  <!-- Bootstrap + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Page CSS -->
  <link rel="stylesheet" href="/css/manage-services.css">
</head>
<body>
  <!-- Navbar (filled by common.js / displayNav) -->
  <div id="nav-placeholder"></div>

  <div class="container-fluid p-0">
    <!-- Hero -->
    <div class="hero px-4 py-4">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <a href="admin-dashboard.html" class="back-btn" title="Back">
            <i class="bi bi-arrow-left"></i>
          </a>
          <div class="avatar"><i class="bi bi-tools"></i></div>
          <div>
            <h1 class="h3 mb-1">Manage Services</h1>
            <div class="text-white-50 small">Configure and manage your business services</div>
          </div>
        </div>
        <div class="d-flex tiles">
          <div class="tile">
            <div class="num" id="kpi-total">0</div>
            <div class="label">Total Services</div>
          </div>
          <div class="tile">
            <div class="num" id="kpi-cats">0</div>
            <div class="label">Categories</div>
          </div>
          <div class="tile">
            <div class="num" id="kpi-rev">$0</div>
            <div class="label">Monthly Revenue</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="container-fluid px-4 py-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
        <div class="d-flex gap-2 flex-wrap">
          <div class="searchbox">
            <input id="searchServices" class="form-control" placeholder="Search services..." />
            <span class="search-icon">🔍</span>
          </div>
          <select id="categoryFilter" class="form-select">
            <option value="all" selected>All Categories</option>
          </select>
          <select id="priceFilter" class="form-select">
            <option value="all" selected>All Prices</option>
            <option value="lt50">&lt; $50</option>
            <option value="50-99">$50 – $99</option>
            <option value="100plus">$100+</option>
          </select>
        </div>

        <div class="d-flex align-items-center gap-2">
          <div class="btn-group view-tabs">
            <button id="tab-cards" class="btn btn-light active">Cards</button>
            <button id="tab-table" class="btn btn-light">Table</button>
          </div>
          <button class="chip-btn chip-add" id="addServiceBtn">
            <i class="bi bi-plus"></i> Add Service
          </button>
        </div>
      </div>

      <!-- Cards -->
      <div id="cardsView" class="row g-4"></div>

      <!-- Table -->
      <div id="tableView" class="card shadow-sm mt-3 d-none">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Monthly</th>
                <th>Yearly</th>
                <th style="width: 170px;">Actions</th>
              </tr>
            </thead>
            <tbody id="service-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="serviceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="form-title">Add New Service</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="service-form">
            <input type="hidden" id="service-id" />
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" id="name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" id="description" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <input type="text" id="category" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Monthly Price</label>
              <input type="number" id="monthly" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Yearly Price (optional)</label>
              <input type="number" id="yearly" class="form-control" />
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./scripts/manage-services.js"></script>
</body>
</html>
