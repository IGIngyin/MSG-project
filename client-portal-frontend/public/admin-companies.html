<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client's Companies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
  <div class="d-flex align-items-center gap-3">
    <a href="admin-dashboard.html" class="btn btn-outline-secondary">← Back</a>
    <h2 class="mb-0">Companies Created by Client</h2>
  </div>
  <button class="btn btn-primary" onclick="showAddCompanyModal()">+ Add Company</button>
</div>

    

    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>SSIC</th>
          <th>Address</th>
          <th>Paid Up Share Capital</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="company-table-body">
        <!-- Company rows will be inserted here dynamically -->
      </tbody>
    </table>

    <!-- Add Company Modal -->
    <div class="modal fade" id="addCompanyModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="add-company-form">
            <div class="modal-header">
              <h5 class="modal-title">Add New Company</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="text" id="addName" class="form-control mb-2" placeholder="Company Name" required />
              <input type="text" id="addDescription" class="form-control mb-2" placeholder="Description" required />
              <input type="text" id="addSSIC" class="form-control mb-2" placeholder="SSIC" required />
              <input type="text" id="addAddress" class="form-control mb-2" placeholder="Address" required />
              <input type="number" id="addCapital" class="form-control mb-2" placeholder="Paid-Up Share Capital" required />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-success">Add</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Edit Company Modal -->
    <div class="modal fade" id="editCompanyModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="edit-company-form">
            <div class="modal-header">
              <h5 class="modal-title">Edit Company</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editCompanyId" />
              <input type="text" id="editName" class="form-control mb-2" placeholder="Company Name" required />
              <input type="text" id="editDescription" class="form-control mb-2" placeholder="Description" required />
              <input type="text" id="editSSIC" class="form-control mb-2" placeholder="SSIC" required />
              <input type="text" id="editAddress" class="form-control mb-2" placeholder="Address" required />
              <input type="number" id="editCapital" class="form-control mb-2" placeholder="Paid-Up Share Capital" required />
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-warning">Save Changes</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./scripts/admin-companies.js"></script>
  <script>
  fetch("nav_admin.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("nav-placeholder").innerHTML = html;

      // ✅ Attach logout logic after navbar is injected
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("adminToken");
          window.location.href = "login.html";
        });
      }
    });
</script>


</body>
</html>
