<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Client's Companies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="/css/admin-companies.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <!-- Hero -->
  <div class="hero px-4 py-4">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
          <a href="admin-dashboard.html" class="back-btn" title="Back">
      <i class="bi bi-arrow-left"></i>
    </a>
          <div id="clientAvatar" class="avatar">CL</div>
          <div>
            <h1 id="clientTitle" class="h3 mb-1">Client’s Companies</h1>
            <div id="clientEmail" class="text-white-50 small">—</div>
          </div>
        </div>
        <div class="d-flex gap-3 tiles">
          <div class="tile">
            <div class="num" id="kpi-total">0</div>
            <div class="label">Total Companies</div>
          </div>
          <div class="tile">
            <div class="num" id="kpi-capital">$0</div>
            <div class="label">Total Capital</div>
          </div>
          <div class="tile">
            <div class="num" id="kpi-active">0</div>
            <div class="label">Active</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid px-4 py-3">

    <!-- Controls -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
      <div class="d-flex gap-2 flex-wrap">
        <div class="searchbox">
          <input id="searchCompanies" class="form-control" placeholder="Search companies..." />
          <span class="search-icon">🔍</span>
        </div>
        <select id="capitalFilter" class="form-select">
          <option value="all" selected>All Capital Ranges</option>
          <option value="lt500">&lt; 500</option>
          <option value="500-999">500 – 999</option>
          <option value="1000plus">≥ 1000</option>
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="btn-group view-tabs">
          <button id="tab-cards" class="btn btn-light active">Cards</button>
          <button id="tab-table" class="btn btn-light">Table</button>
        </div>
        <button class="chip-btn chip-add" id="addCompanyBtn"><i class="bi bi-plus"></i> Add</button>

      </div>
    </div>

    <!-- Cards -->
    <div id="cardsView" class="row g-4 mt-2"></div>

    <!-- Table -->
    <div id="tableView" class="card shadow-sm mt-3 d-none">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>SSIC</th>
              <th>Address</th>
              <th>Paid Up Capital</th>
              <th style="width: 180px;">Actions</th>
            </tr>
          </thead>
          <tbody id="company-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Portfolio Summary -->
    <div class="row g-3 mt-4">
      <div class="col-12 col-md-3">
        <div class="summary-card">
          <div class="summary-label">Total Companies</div>
          <div class="summary-value" id="sum-total">0</div>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <div class="summary-card">
          <div class="summary-label">Total Capital</div>
          <div class="summary-value" id="sum-capital">$0</div>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <div class="summary-card">
          <div class="summary-label">Average Capital</div>
          <div class="summary-value" id="sum-avg">$0</div>
        </div>
      </div>
      <div class="col-12 col-md-3">
        <div class="summary-card">
          <div class="summary-label">Active Companies</div>
          <div class="summary-value" id="sum-active">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Company Modal -->
  <div class="modal fade" id="addCompanyModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="add-company-form">
          <div class="modal-header">
            <h5 class="modal-title">Add New Company</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="text" id="addName" class="form-control mb-2" placeholder="Company Name" required />
            <input type="text" id="addDescription" class="form-control mb-2" placeholder="Description" required />
            <input type="text" id="addSSIC" class="form-control mb-2" placeholder="SSIC" required />
            <input type="text" id="addAddress" class="form-control mb-2" placeholder="Address" required />
            <input type="number" id="addCapital" class="form-control mb-2" placeholder="Paid-Up Share Capital" required />
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Add</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Edit Company Modal -->
  <div class="modal fade" id="editCompanyModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="edit-company-form">
          <div class="modal-header">
            <h5 class="modal-title">Edit Company</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editCompanyId" />
            <input type="text" id="editName" class="form-control mb-2" placeholder="Company Name" required />
            <input type="text" id="editDescription" class="form-control mb-2" placeholder="Description" required />
            <input type="text" id="editSSIC" class="form-control mb-2" placeholder="SSIC" required />
            <input type="text" id="editAddress" class="form-control mb-2" placeholder="Address" required />
            <input type="number" id="editCapital" class="form-control mb-2" placeholder="Paid-Up Share Capital" required />
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-warning">Save Changes</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./scripts/admin-companies.js"></script>
  <script>
    fetch("nav_admin.html").then(r=>r.text()).then(html=>{
      document.getElementById("nav-placeholder").innerHTML = html;
      document.getElementById("logout-btn")?.addEventListener("click",()=>{
        localStorage.removeItem("adminToken"); window.location.href="login.html";
      });
    });
  </script>
</body>
</html>
