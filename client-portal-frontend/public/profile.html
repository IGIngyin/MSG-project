<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile - Client Portal</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/profile.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        />
    </head>
    <body>
        <div id="navbar-placeholder"></div>

        <div class="container-fluid mt-4">
            <div class="row">
                <div
                    class="col-md-2 bg-light p-3 border-end"
                    style="min-height: 100vh"
                >
                    <h5
                        class="fw-bold mb-3 clickable"
                        data-tab="profile"
                        style="cursor: pointer"
                    >
                        Client's Profile
                    </h5>

                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="credits"
                                >Credits</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="company"
                                >Company</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="services"
                                >Services</a
                            >
                        </li>
                    </ul>
                </div>

                <div class="col-md-10 p-4">
                    <div
                        id="profile-content"
                        class="d-flex gap-4 align-items-start"
                    ></div>
                </div>
            </div>
        </div>

        <div id="footer-placeholder" class="mt-5"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="./scripts/profile.js"></script>
    </body>
</html>
