<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile - Client Portal</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./css/profile.css" />
    </head>
    <body>
        <!-- Navbar Section -->
        <div id="navbar-placeholder"></div>

        <div class="container-fluid mt-4">
            <div class="row">
                <!-- Sidebar Tabs -->
                <div
                    class="col-md-2 bg-light p-3 border-end"
                    style="min-height: 100vh"
                >
                    <h5 class="fw-bold mb-3">Client's Profile</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="email"
                                >Email</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="credits"
                                >Credits</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="company"
                                >Company</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link clickable" data-tab="services"
                                >Services</a
                            >
                        </li>
                    </ul>
                </div>

                <!-- Main Content -->
                <div class="col-md-10 p-4">
                    <div
                        id="profile-content"
                        class="d-flex gap-4 align-items-start"
                    >
                        <!-- This content will be populated by profile.js when clicking sidebar tabs -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Section -->
        <div id="footer-placeholder" class="mt-5"></div>

        <script type="module" src="./scripts/profile.js"></script>
    </body>
</html>
