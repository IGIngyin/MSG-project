<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Company Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container-fluid">
    <div class="mt-3 ms-3">
      <button onclick="goBackToClientCompanies()" class="btn btn-secondary">← Back</button>

    </div>
    <div class="row">
      <!-- Sidebar -->
      <div class="col-md-3 bg-light vh-100">
        
        <ul class="nav flex-column">
          <li class="nav-item"><a href="#" class="nav-link" onclick="showSection('secretaries')">Secretaries</a></li>
          <li class="nav-item"><a href="#" class="nav-link" onclick="showSection('shareholders')">Shareholders</a></li>
          <li class="nav-item"><a href="#" class="nav-link" onclick="showSection('documents')">Documents</a></li>
        </ul>
      </div>

      <!-- Content -->
      <div class="col-md-9 mt-4">
        <!-- Secretaries Section -->
        <div id="secretaries" class="content-section">
          <h3>Secretaries</h3>
          <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#secretaryModal">Add Secretary</button>

          <table class="table">
            <thead>
              <tr>
                <th>Name</th><th>Email</th><th>Phone</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="secretary-table-body"></tbody>
          </table>
        </div>

        <!-- Shareholders Section -->
        <div id="shareholders" class="content-section" style="display:none;">
          <h3>Shareholders</h3>
          <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#shareholderModal">Add Shareholder</button>

          <table class="table">
            <thead>
              <tr>
                <th>Name</th><th>Email</th><th>Phone</th><th>Ordinary Shares</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="shareholder-table-body"></tbody>
          </table>
        </div>

        <!-- Documents Section -->
        <div id="documents" class="content-section" style="display:none;">
          <h3>Uploaded Documents</h3>
          <form id="upload-form" class="mb-3">
            <input type="file" id="file-input" class="form-control mb-2" required />
            <button type="submit" class="btn btn-primary">Upload</button>
          </form>
          <table class="table">
            <thead>
              <tr>
                <th>Filename</th><th>Uploaded At</th><th>Action</th>
              </tr>
            </thead>
            <tbody id="document-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Secretary Modal -->
  <div class="modal fade" id="secretaryModal" tabindex="-1" aria-labelledby="secretaryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="secretary-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="secretaryModalLabel">Secretary</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="secretary-id" />
          <div class="mb-2">
            <input type="text" id="secretary-name" class="form-control" placeholder="Name" required />
          </div>
          <div class="mb-2">
            <input type="email" id="secretary-email" class="form-control" placeholder="Email" required />
          </div>
          <div class="mb-2">
            <input type="text" id="secretary-contact" class="form-control" placeholder="Contact Number" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save Secretary</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shareholder Modal -->
  <div class="modal fade" id="shareholderModal" tabindex="-1" aria-labelledby="shareholderModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form id="shareholder-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="shareholderModalLabel">Shareholder</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="shareholder-id" />
          <div class="mb-2">
            <input type="text" id="shareholder-name" class="form-control" placeholder="Name" required />
          </div>
          <div class="mb-2">
            <input type="email" id="shareholder-email" class="form-control" placeholder="Email" required />
          </div>
          <div class="mb-2">
            <input type="text" id="shareholder-contact" class="form-control" placeholder="Contact Number" required />
          </div>
          <div class="mb-2">
            <input type="number" id="shareholder-shares" class="form-control" placeholder="Ordinary Shares" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save Shareholder</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./scripts/company-details.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  fetch("nav_admin.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("nav-placeholder").innerHTML = html;

      // ✅ Attach logout logic after navbar is injected
      const logoutBtn = document.getElementById("logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("adminToken");
          window.location.href = "login.html";
        });
      }
    });
</script>


</body>
</html>
