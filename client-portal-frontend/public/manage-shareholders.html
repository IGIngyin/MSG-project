<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Shareholders</title>
</head>

<body>

    <!-- Navbar Section -->
    <div id="navbar-placeholder"></div>

    <h2 class="mb-4 text-center">Manage Shareholders</h2>

    <div class="container mt-4">

        <!-- Add Button -->
        <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#shareholderModal">
                <i class="fa fa-plus"></i> Add Shareholder
            </button>
        </div>

        <!-- Shareholders Table -->
        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Ordinary Share Number</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="shareholders-list"></tbody>
        </table>

        <a href="/profile.html" class="btn btn-secondary m-3"> Back </a>
    </div>

    <!-- Shareholder Modal -->
    <div class="modal fade" id="shareholderModal" tabindex="-1" aria-labelledby="shareholderModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="form-title">Add New Shareholder</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="shareholder-form">
                        <input type="hidden" id="shareholder-id">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="shareholder-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="shareholder-email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contact</label>
                            <input type="text" id="shareholder-contact" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ordinary Share Number</label>
                            <input type="number" id="shareholder-ordinaryShareNumber" class="form-control" required>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <div id="footer-placeholder"></div>
    <script type="module" src="./scripts/manage-shareholders.js"></script>
</body>

</html>
