<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Client Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  
  <link rel="stylesheet" href="/css/admin-dashboard.css">

</head>
<body>
  <!-- Navbar -->
  <div id="nav-placeholder"></div>

  <div class="container-fluid px-4 py-3">

    <!-- Top bar (title + KPIs) -->
    <div class="bg-primary text-white rounded-4 p-4 shadow-sm kpi-header">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <h1 class="h3 mb-0">Client Management</h1>
        <div class="d-flex gap-4 kpi-wrap">
          <div class="kpi">
            <div class="kpi-number" id="kpi-total-clients">0</div>
            <div class="kpi-label">Total Clients</div>
          </div>
          <div class="kpi">
            <div class="kpi-number" id="kpi-total-companies">0</div>
            <div class="kpi-label">Companies</div>
          </div>
          <div class="kpi">
            <div class="kpi-number" id="kpi-avg-per-client">0</div>
            <div class="kpi-label">Avg/Client</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls row -->
    <div class="d-flex align-items-center justify-content-between mt-4 flex-wrap gap-3">
      <div class="d-flex gap-2 flex-wrap">
        <div class="searchbox">
          <input id="search" class="form-control" placeholder="Search clients..." />
          <span class="search-icon">🔍</span>
        </div>
        <select id="companyFilter" class="form-select">
          <option value="all" selected>All Companies</option>
          <option value="0">0 Companies</option>
          <option value="1-2">1–2 Companies</option>
          <option value="3plus">3+ Companies</option>
        </select>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="view-tabs btn-group" role="group" aria-label="View Switch">
          <button id="tab-cards" class="btn btn-light active">Cards</button>
          <button id="tab-table" class="btn btn-light">Table</button>
          <button id="tab-analytics" class="btn btn-light">Analytics</button>
        </div>
        <button class="btn btn-primary rounded-pill px-3" id="addClientBtn">+ Add Client</button>
      </div>
    </div>

    <!-- Cards grid -->
    <div id="cardsView" class="row g-4 mt-2"></div>

    <!-- Table view -->
    <div id="tableView" class="card shadow-sm mt-3 d-none">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th style="width: 160px;">Companies</th>
              <th style="width: 200px;">Actions</th>
            </tr>
          </thead>
          <tbody id="client-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Analytics placeholder -->
    <div id="analyticsView" class="mt-4 d-none">
      <div class="alert alert-info mb-0">
        Analytics coming soon. (Hook your charts here.)
      </div>
    </div>
  </div>

  <!-- Add Client Modal -->
  <div id="addClientModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="add-client-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Client</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
  <input type="text" id="addName" class="form-control mb-2" placeholder="Full Name" required />
  <input type="tel" id="addPhone" class="form-control mb-2" placeholder="Phone (e.g. +65 8123 4567)" required />
  <input type="email" id="addEmail" class="form-control mb-2" placeholder="Email" required />
  <input type="password" id="addPassword" class="form-control mb-3" placeholder="Password" required />
</div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Add</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Client Modal -->
  <div id="editClientModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="edit-client-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Client</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
  <input type="hidden" id="editClientId" />
  <input type="text" id="editName" class="form-control mb-2" placeholder="Full Name" required />
  <input type="tel" id="editPhone" class="form-control mb-2" placeholder="Phone" required />
  <input type="email" id="editEmail" class="form-control mb-2" placeholder="Email" required />
  <!-- Password NOT required when editing -->
  <input type="password" id="editPassword" class="form-control mb-3" placeholder="New Password (leave blank to keep)" />
</div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script type="module" src="./scripts/admin-dashboard.js"></script>
  <script>
    // Load navbar and wire logout
    fetch("nav_admin.html")
      .then(res => res.text())
      .then(html => {
        document.getElementById("nav-placeholder").innerHTML = html;
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("adminToken");
            window.location.href = "login.html";
          });
        }
      });
  </script>
</body>
</html>
