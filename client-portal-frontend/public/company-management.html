<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Company Management Portal</title>

        <!-- Bootstrap + Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />

        <style>
            :root {
                --primary-color: #6366f1;
                --secondary-color: #8b5cf6;
                --success-color: #10b981;
                --warning-color: #f59e0b;
                --danger-color: #ef4444;
                --info-color: #3b82f6;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
            }
            .navbar {
                background: rgba(255, 255, 255, 0.95) !important;
                backdrop-filter: blur(20px);
                box-shadow: var(--shadow-sm);
                padding: 1rem 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            }
            .navbar-brand {
                color: var(--primary-color) !important;
                font-weight: 700;
                font-size: 1.5rem;
            }
            .back-button {
                background: rgba(255, 255, 255, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.3);
                color: #fff;
                padding: 0.5rem 1rem;
                border-radius: 8px;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 2rem;
                transition: 0.3s;
            }
            .back-button:hover {
                background: rgba(255, 255, 255, 0.3);
                color: #fff;
                text-decoration: none;
            }
            .main-container {
                padding: 2rem 0;
            }
            .company-header {
                background: linear-gradient(135deg, #5b61f6 0%, #8b5cf6 100%);
                color: #fff;
                padding: 0.75rem 1rem; /* smaller */
                border-radius: 14px;
                margin-bottom: 1rem; /* tighter */
                position: relative;
                overflow: hidden;
                box-shadow: 0 8px 20px rgba(17, 24, 39, 0.08);
            }
            .company-title {
                font-size: 1.45rem;
                font-weight: 700;
                margin: 0 0 0.15rem 0;
            }
            .company-subtitle {
                font-size: 0.92rem;
                opacity: 0.95;
                margin: 0;
            }
            .stats-container {
                display: flex;
                gap: 0.75rem;
                flex-wrap: wrap;
            }
            .stat-item {
                background: rgba(255, 255, 255, 0.15);
                padding: 0.6rem 0.85rem;
                border-radius: 12px;
                min-width: 88px;
                text-align: center;
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.12);
            }
            .stat-number {
                font-size: 1.25rem;
                font-weight: 700;
                margin-bottom: 0.1rem;
            }
            .stat-label {
                font-size: 0.72rem;
                opacity: 0.95;
                font-weight: 500;
            }

            .content-wrapper {
                background: #fff;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: var(--shadow-lg);
                margin-top: 1.5rem;
            }
            .sidebar {
                background: #f8fafc;
                padding: 2rem 1rem;
                border-right: 1px solid #e2e8f0;
                min-height: 600px;
            }
            .sidebar-title {
                font-weight: 700;
                margin-bottom: 1.5rem;
                color: #1e293b;
            }
            .sidebar-item {
                display: flex;
                align-items: center;
                padding: 1rem;
                margin-bottom: 0.5rem;
                border-radius: 12px;
                cursor: pointer;
                transition: 0.3s;
                border: none;
                background: none;
                width: 100%;
                text-align: left;
                color: #64748b;
                font-weight: 500;
            }
            .sidebar-item:hover {
                background: #e2e8f0;
                color: #334155;
                transform: translateX(5px);
            }
            .sidebar-item.active {
                background: linear-gradient(
                    135deg,
                    var(--primary-color),
                    var(--secondary-color)
                );
                color: #fff;
                box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            }
            .sidebar-item i {
                width: 20px;
                margin-right: 0.75rem;
                font-size: 1.1rem;
            }
            .main-content {
                padding: 2rem;
            }
            .section-header {
                display: flex;
                justify-content: between;
                align-items: flex-start;
                margin-bottom: 2rem;
            }
            .section-title {
                font-size: 1.8rem;
                font-weight: 700;
                color: #1e293b;
                margin-bottom: 0.5rem;
            }
            .section-subtitle {
                color: #64748b;
                font-size: 1rem;
            }
            .controls-section {
                display: flex;
                gap: 1rem;
                margin-bottom: 2rem;
                flex-wrap: wrap;
                align-items: center;
            }
            .search-box {
                position: relative;
                flex: 1;
                max-width: 300px;
            }
            .search-box input {
                padding: 0.75rem 1rem 0.75rem 2.5rem;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                width: 100%;
                transition: 0.3s;
            }
            .search-box input:focus {
                outline: 0;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            }
            .search-box i {
                position: absolute;
                left: 1rem;
                top: 50%;
                transform: translateY(-50%);
                color: #64748b;
            }
            .filter-select {
                padding: 0.75rem 1rem;
                border: 2px solid #e2e8f0;
                border-radius: 12px;
                background: #fff;
                min-width: 150px;
            }
            .view-toggle {
                display: flex;
                background: #f1f5f9;
                border-radius: 10px;
                padding: 0.25rem;
            }
            .view-btn {
                padding: 0.5rem 1rem;
                border: none;
                background: none;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.3s;
            }
            .view-btn.active {
                background: #fff;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
            .add-btn {
                background: linear-gradient(
                    135deg,
                    var(--primary-color),
                    var(--secondary-color)
                );
                color: #fff;
                border: none;
                padding: 0.75rem 1.5rem;
                border-radius: 12px;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                cursor: pointer;
                transition: 0.3s;
                text-decoration: none;
            }
            .add-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
                color: #fff;
            }
            .member-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
                gap: 1.5rem;
            }
            .member-card {
                background: #fff;
                border: 2px solid #f1f5f9;
                border-radius: 15px;
                padding: 1.5rem;
                transition: 0.3s;
                position: relative;
                overflow: hidden;
            }
            .member-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(
                    90deg,
                    var(--primary-color),
                    var(--secondary-color)
                );
            }
            .member-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                border-color: var(--primary-color);
            }
            .member-header {
                display: flex;
                align-items: center;
                margin-bottom: 1rem;
            }
            .member-avatar {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                background: linear-gradient(
                    135deg,
                    var(--primary-color),
                    var(--secondary-color)
                );
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-weight: 700;
                font-size: 1.2rem;
                margin-right: 1rem;
                box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            }
            .member-info {
                flex: 1;
            }
            .member-name {
                font-size: 1.2rem;
                font-weight: 700;
                color: #1e293b;
                margin-bottom: 0.25rem;
            }
            .member-email {
                color: #64748b;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-bottom: 0.5rem;
            }
            .member-details {
                display: flex;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
                margin-bottom: 1rem;
            }
            .member-detail {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                color: #64748b;
                font-size: 0.9rem;
            }
            .member-status {
                display: inline-flex;
                align-items: center;
                gap: 0.25rem;
                padding: 0.25rem 0.75rem;
                border-radius: 20px;
                font-size: 0.8rem;
                font-weight: 700;
            }
            .status-active {
                background: #d1fae5;
                color: #065f46;
            }
            .status-inactive {
                background: #fee2e2;
                color: #991b1b;
            }
            .member-actions {
                display: flex;
                gap: 0.5rem;
                justify-content: flex-end;
            }
            .action-btn {
                padding: 0.5rem;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
            }
            .btn-edit {
                background: #fef3c7;
                color: #92400e;
            }
            .btn-edit:hover {
                background: #fcd34d;
                transform: scale(1.1);
            }
            .btn-delete {
                background: #fecaca;
                color: #991b1b;
            }
            .btn-delete:hover {
                background: #f87171;
                transform: scale(1.1);
            }
            .empty-state {
                text-align: center;
                padding: 4rem 2rem;
                color: #64748b;
            }
            .empty-state i {
                font-size: 4rem;
                margin-bottom: 1rem;
                color: #cbd5e1;
            }
            .empty-state h3 {
                margin-bottom: 0.5rem;
                color: #334155;
            }
            .loading-state {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 4rem 2rem;
                color: #64748b;
            }
            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #e2e8f0;
                border-top: 4px solid var(--primary-color);
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 1rem;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .modal-content {
                border-radius: 15px;
                border: none;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            }
            .modal-header {
                border-bottom: 1px solid #e2e8f0;
                padding: 1.5rem;
                background: linear-gradient(
                    135deg,
                    var(--primary-color),
                    var(--secondary-color)
                );
                color: #fff;
                border-radius: 15px 15px 0 0;
            }
            .btn-close {
                filter: brightness(0) invert(1);
            }
            .modal-body {
                padding: 2rem 1.5rem;
            }
            .form-label {
                font-weight: 600;
                color: #374151;
                margin-bottom: 0.5rem;
            }
            .form-control {
                border: 2px solid #e5e7eb;
                border-radius: 10px;
                padding: 0.75rem 1rem;
                transition: 0.3s;
            }
            .form-control:focus {
                outline: 0;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            }
            .btn-primary {
                background: linear-gradient(
                    135deg,
                    var(--primary-color),
                    var(--secondary-color)
                );
                border: none;
                padding: 0.75rem 2rem;
                border-radius: 10px;
                font-weight: 600;
                transition: 0.3s;
            }
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
            }
            .btn-secondary {
                background: #e5e7eb;
                color: #374151;
                border: none;
                padding: 0.75rem 2rem;
                border-radius: 10px;
                font-weight: 600;
                transition: 0.3s;
            }
            .btn-secondary:hover {
                background: #d1d5db;
                color: #374151;
            }
            .document-card {
                background: #fff;
                border: 2px solid #f1f5f9;
                border-radius: 15px;
                padding: 1.5rem;
                margin-bottom: 1rem;
                transition: 0.3s;
                position: relative;
                overflow: hidden;
            }
            .document-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(
                    90deg,
                    var(--info-color),
                    var(--primary-color)
                );
            }
            .document-icon {
                width: 50px;
                height: 50px;
                border-radius: 12px;
                background: linear-gradient(
                    135deg,
                    var(--info-color),
                    var(--primary-color)
                );
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 1.5rem;
                margin-right: 1rem;
            }
            @media (max-width: 768px) {
                .company-title {
                    font-size: 2rem;
                }
                .stats-container {
                    gap: 1rem;
                }
                .stat-item {
                    min-width: 100px;
                    padding: 1rem;
                }
                .member-grid {
                    grid-template-columns: 1fr;
                }
                .controls-section {
                    flex-direction: column;
                    align-items: stretch;
                }
                .search-box {
                    max-width: 100%;
                }

                .company-header {
                    padding: 0.9rem 1.25rem !important;
                    border-radius: 16px !important;
                    margin-bottom: 1rem !important;
                }
                .company-title {
                    font-size: 1.6rem !important;
                    margin-bottom: 0.25rem !important;
                }
                .company-subtitle {
                    font-size: 0.95rem !important;
                    margin-bottom: 0.5rem !important;
                }

                .stats-container {
                    gap: 0.75rem !important;
                }
                .stat-item {
                    padding: 0.6rem 0.9rem !important;
                    min-width: 90px !important;
                }
                .stat-number {
                    font-size: 1.25rem !important;
                }
                .stat-label {
                    font-size: 0.75rem !important;
                }

                .main-container {
                    padding-top: 1rem !important;
                    padding-bottom: 1rem !important;
                }
                .content-wrapper {
                    margin-top: 1rem !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="navbar-placeholder"></div>

        <div class="container-fluid main-container">
            <div class="container">
                <a href="#" id="back-btn" class="back-button"
                    ><i class="fas fa-arrow-left"></i><span>Back</span></a
                >
            </div>

            <div class="container">
                <div class="company-header">
                    <div class="row align-items-center">
                        <div class="col-lg-8">
                            <div class="company-title" id="company-title">
                                TechCorp Solutions
                            </div>
                            <div class="company-subtitle" id="company-subtitle">
                                Manage company secretaries, shareholders and
                                documents
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="stats-container justify-content-lg-end">
                                <div class="stat-item">
                                    <div class="stat-number" id="total-count">
                                        0
                                    </div>
                                    <div class="stat-label" id="stat-label-1">
                                        Total
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number" id="active-count">
                                        0
                                    </div>
                                    <div class="stat-label" id="stat-label-2">
                                        Active
                                    </div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-number" id="unique-count">
                                        0
                                    </div>
                                    <div class="stat-label" id="stat-label-3">
                                        Unique
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /company-header -->
            </div>

            <div class="container">
                <div class="content-wrapper">
                    <div class="row g-0">
                        <!-- Sidebar -->
                        <div class="col-lg-3">
                            <div class="sidebar">
                                <div class="sidebar-title">
                                    <i class="fas fa-users me-2"></i>Management
                                </div>
                                <button
                                    class="sidebar-item active"
                                    data-section="secretaries"
                                >
                                    <i class="fas fa-user-tie"></i
                                    ><span>Secretaries</span>
                                </button>
                                <button
                                    class="sidebar-item"
                                    data-section="shareholders"
                                >
                                    <i class="fas fa-chart-line"></i
                                    ><span>Shareholders</span>
                                </button>
                                <button
                                    class="sidebar-item"
                                    data-section="documents"
                                >
                                    <i class="fas fa-folder-open"></i
                                    ><span>Documents</span>
                                </button>
                            </div>
                        </div>

                        <!-- Main -->
                        <div class="col-lg-9">
                            <div class="main-content">
                                <div class="section-header">
                                    <div>
                                        <h2
                                            class="section-title"
                                            id="section-title"
                                        >
                                            Secretaries Management
                                        </h2>
                                        <p
                                            class="section-subtitle"
                                            id="section-subtitle"
                                        >
                                            Manage company secretaries and their
                                            information
                                        </p>
                                    </div>
                                </div>

                                <div class="controls-section">
                                    <div class="search-box">
                                        <i class="fas fa-search"></i>
                                        <input
                                            type="text"
                                            id="search-input"
                                            placeholder="Search..."
                                            class="form-control"
                                        />
                                    </div>

                                    <select
                                        class="filter-select"
                                        id="status-filter"
                                    >
                                        <option value="all">All Status</option>
                                        <option value="active">Active</option>
                                        <option value="inactive">
                                            Inactive
                                        </option>
                                    </select>
                                    <!-- View toggle -->
                                    <div class="view-toggle" id="view-toggle">
                                        <button
                                            class="view-btn active"
                                            data-view="cards"
                                        >
                                            Cards
                                        </button>
                                        <button
                                            class="view-btn"
                                            data-view="table"
                                        >
                                            Table
                                        </button>
                                    </div>

                                    <button class="add-btn" id="add-item-btn">
                                        <i class="fas fa-plus"></i
                                        ><span>Add</span>
                                    </button>
                                </div>

                                <div id="content-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /content-wrapper -->
            </div>
        </div>

        <div id="footer-placeholder"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script type="module" src="./scripts/company-management.js"></script>
    </body>
</html>
